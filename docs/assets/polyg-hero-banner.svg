<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="40%" style="stop-color:#111820"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>

    <linearGradient id="causalGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    
    <linearGradient id="nodeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="nodeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="nodeOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="nodeRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrowCausal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7" fill="#f59e0b" opacity="0.8"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bgGradient)"/>
  
  <!-- Subtle grid -->
  <g opacity="0.04">
    <line x1="0" y1="40" x2="1200" y2="40" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="1200" y2="80" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="1200" y2="160" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="280" x2="1200" y2="280" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- ═══ Right side: Causal chain visualization ═══ -->
  <g transform="translate(780, 50)">
    <!-- Causal chain: A → B → C → D with confidence scores -->
    
    <!-- Node 1: Root cause -->
    <g filter="url(#glow)">
      <rect x="0" y="0" width="160" height="36" rx="6" fill="#161b22" stroke="#f59e0b" stroke-width="1.5" opacity="0.9"/>
      <text x="12" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#f59e0b" font-weight="600">JWT_SECRET removed</text>
    </g>
    
    <!-- Arrow 1→2 -->
    <line x1="80" y1="38" x2="80" y2="58" stroke="#f59e0b" stroke-width="2" opacity="0.7" marker-end="url(#arrowCausal)"/>
    <text x="92" y="52" font-family="system-ui, sans-serif" font-size="9" fill="#3fb950" font-weight="600">100%</text>
    
    <!-- Node 2 -->
    <g filter="url(#glow)">
      <rect x="10" y="62" width="160" height="36" rx="6" fill="#161b22" stroke="#f59e0b" stroke-width="1.5" opacity="0.8"/>
      <text x="22" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#d29922">deploy missing secret</text>
    </g>
    
    <!-- Arrow 2→3 -->
    <line x1="90" y1="100" x2="90" y2="120" stroke="#f59e0b" stroke-width="2" opacity="0.6" marker-end="url(#arrowCausal)"/>
    <text x="102" y="114" font-family="system-ui, sans-serif" font-size="9" fill="#3fb950" font-weight="600">100%</text>
    
    <!-- Node 3 -->
    <g filter="url(#glow)">
      <rect x="20" y="124" width="160" height="36" rx="6" fill="#161b22" stroke="#f59e0b" stroke-width="1.5" opacity="0.7"/>
      <text x="32" y="147" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#d29922">CrashLoopBackOff</text>
    </g>
    
    <!-- Arrow 3→4 -->
    <line x1="100" y1="162" x2="100" y2="182" stroke="#f59e0b" stroke-width="2" opacity="0.5" marker-end="url(#arrowCausal)"/>
    <text x="112" y="176" font-family="system-ui, sans-serif" font-size="9" fill="#e3b341" font-weight="600">95%</text>
    
    <!-- Node 4 -->
    <g>
      <rect x="30" y="186" width="160" height="36" rx="6" fill="#161b22" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>
      <text x="42" y="209" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b7a45">503 → dashboard down</text>
    </g>
    
    <!-- Subtle "confidence degrades" annotation -->
    <text x="200" y="136" font-family="system-ui, sans-serif" font-size="9" fill="#484f58" font-style="italic">confidence</text>
    <text x="200" y="148" font-family="system-ui, sans-serif" font-size="9" fill="#484f58" font-style="italic">propagates ↓</text>

    <!-- Cross-graph indicators -->
    <g opacity="0.5">
      <circle cx="-10" cy="18" r="4" fill="url(#nodeBlue)"/>
      <circle cx="-10" cy="80" r="4" fill="url(#nodeRed)"/>
      <circle cx="-10" cy="142" r="4" fill="url(#nodeGreen)"/>
    </g>
  </g>

  <!-- Four graph dots legend (right side, bottom) -->
  <g transform="translate(830, 275)">
    <circle cx="0" cy="0" r="4" fill="url(#nodeBlue)"/>
    <text x="10" y="4" font-family="system-ui, sans-serif" font-size="9" fill="#484f58">Semantic</text>
    <circle cx="75" cy="0" r="4" fill="url(#nodeGreen)"/>
    <text x="85" y="4" font-family="system-ui, sans-serif" font-size="9" fill="#484f58">Temporal</text>
    <circle cx="150" cy="0" r="4" fill="url(#nodeOrange)"/>
    <text x="160" y="4" font-family="system-ui, sans-serif" font-size="9" fill="#484f58">Causal</text>
    <circle cx="215" cy="0" r="4" fill="url(#nodeRed)"/>
    <text x="225" y="4" font-family="system-ui, sans-serif" font-size="9" fill="#484f58">Entity</text>
  </g>

  <!-- ═══ Left side: Branding ═══ -->
  
  <!-- Polyhedron icon -->
  <g transform="translate(65, 85)" filter="url(#softGlow)">
    <polygon points="55,5 95,25 95,65 55,85 15,65 15,25" 
             fill="none" stroke="url(#accentGradient)" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="55" y1="5" x2="55" y2="45" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.6"/>
    <line x1="15" y1="25" x2="55" y2="45" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.6"/>
    <line x1="95" y1="25" x2="55" y2="45" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.6"/>
    <line x1="55" y1="45" x2="15" y2="65" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.4"/>
    <line x1="55" y1="45" x2="95" y2="65" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.4"/>
    <line x1="55" y1="45" x2="55" y2="85" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.4"/>
    <!-- Inner glow dots at vertices -->
    <circle cx="55" cy="5" r="3" fill="#c084fc" opacity="0.8"/>
    <circle cx="95" cy="25" r="3" fill="#c084fc" opacity="0.6"/>
    <circle cx="15" cy="25" r="3" fill="#c084fc" opacity="0.6"/>
    <circle cx="55" cy="45" r="4" fill="#a855f7" opacity="0.9"/>
    <circle cx="55" cy="85" r="3" fill="#c084fc" opacity="0.4"/>
    <circle cx="95" cy="65" r="3" fill="#c084fc" opacity="0.4"/>
    <circle cx="15" cy="65" r="3" fill="#c084fc" opacity="0.4"/>
  </g>
  
  <!-- Main title -->
  <text x="205" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="800" fill="url(#accentGradient)" letter-spacing="-1">polyg-mcp</text>
  
  <!-- Subtitle -->
  <text x="208" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#8b949e">The memory system that understands causality.</text>
  
  <!-- Tagline -->
  <text x="208" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#484f58">Ask "why did auth fail?" — get a traced causal chain, not just similar documents.</text>
  
  <!-- Tech badges -->
  <g transform="translate(208, 222)">
    <rect x="0" y="0" width="85" height="24" rx="4" fill="#238636" opacity="0.9"/>
    <text x="42.5" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">TypeScript</text>
    
    <rect x="95" y="0" width="55" height="24" rx="4" fill="#1f6feb" opacity="0.9"/>
    <text x="122.5" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">MCP</text>
    
    <rect x="160" y="0" width="80" height="24" rx="4" fill="#7c3aed" opacity="0.9"/>
    <text x="200" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">FalkorDB</text>
    
    <rect x="250" y="0" width="75" height="24" rx="4" fill="#d97706" opacity="0.9"/>
    <text x="287.5" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">MAGMA</text>
  </g>
  
  <!-- Accent line -->
  <rect x="208" y="262" width="180" height="2.5" rx="1.25" fill="url(#accentGradient)" opacity="0.5"/>
</svg>
